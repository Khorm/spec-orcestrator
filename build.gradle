plugins {
//	id 'org.springframework.boot' version '2.7.10'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'java-library'
}

group = 'com.petra'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

repositories {
	mavenCentral()
//	maven { url 'https://repo.spring.io/milestone' }
//	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-data-jdbc:2.7.10'
    api 'org.springframework.boot:spring-boot-starter-jdbc:2.7.10'
//	implementation 'org.springframework.kafka:spring-kafka'
	// https://mvnrepository.com/artifact/org.codehaus.groovy/groovy-all
    api "org.codehaus.groovy:groovy-all:3.0.24"
    api group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '2.7.10'
//	implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-openfeign', version: '3.1.6'

    api group: 'org.hibernate', name: 'hibernate-core', version: '5.6.15.Final'
    api group: 'org.hibernate', name: 'hibernate-entitymanager', version: '5.6.15.Final'

    api group: 'org.postgresql', name: 'postgresql', version: '42.6.0'

    api group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '2.7.10'
    api 'org.springframework.boot:spring-boot-starter-log4j2:2.7.10'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-actuator
//    api("org.springframework.boot:spring-boot-starter-actuator:2.7.10")
    api "org.springframework.boot:spring-boot-starter-actuator:2.7.10"

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-autoconfigure
    api "org.springframework.boot:spring-boot-autoconfigure:2.7.10"


//	implementation group: 'org.nanohttpd', name: 'nanohttpd', version: '2.3.1'

//	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core'//, version: '2.14.1'
//	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind'//, version: '2.14.1'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
    api 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    api "com.zaxxer:HikariCP:6.3.3"


	compileOnly 'org.projectlombok:lombok:1.18.30'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.10'
//	testImplementation 'org.springframework.kafka:spring-kafka-test'



	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

